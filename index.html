<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My beloved girl bday</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display (Serif) & Nunito (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles & Typography */
        body {
            font-family: 'Nunito', sans-serif;
            /* Ghibli sunset painted sky gradient */
            background: linear-gradient(180deg, #6ca1c9 0%, #b2cbde 35%, #f6d3a9 70%, #f4a2a2 100%);
            color: #2c241b;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* --- Cloud Parallax Animations --- */
        .cloud {
            position: absolute;
            will-change: transform;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes driftLeft {
            0% { transform: translateX(110vw); }
            100% { transform: translateX(-20vw); }
        }

        @keyframes driftRight {
            0% { transform: translateX(-20vw); }
            100% { transform: translateX(110vw); }
        }

        /* Distinct speeds and delays for parallax depth */
        .cloud-1 { animation: driftRight 60s linear infinite; top: 10%; width: 250px; }
        .cloud-2 { animation: driftRight 45s linear infinite; top: 25%; width: 180px; animation-delay: -20s; opacity: 0.6; }
        .cloud-3 { animation: driftLeft 70s linear infinite; top: 15%; width: 300px; animation-delay: -10s; }
        .cloud-4 { animation: driftLeft 50s linear infinite; top: 35%; width: 150px; animation-delay: -35s; opacity: 0.5; }

        /* --- Smooth Text Reveal Animations --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Glowing Light Motes */
        .mote {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255, 255, 255, 0.8), 0 0 20px 5px rgba(255, 230, 150, 0.5);
            opacity: 0;
            animation: floatUp linear infinite;
            z-index: 2;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(255, 154, 158, 0.2);
        }

        /* Panel Transitions */
        .panel {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Polaroid Tilt */
        .polaroid-frame {
            background: white;
            padding: 12px 12px 40px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .polaroid-frame:hover {
            transform: rotate(0deg);
        }
        
        /* Icon Hover */
        .icon-btn {
            transition: all 0.3s ease;
        }
        .icon-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.5);
        }

        /* --- Ghibli Decorations --- */
        /* Soot Sprites (Susuwatari) */
        .soot {
            position: fixed;
            bottom: 30px;
            width: 50px;
            height: 50px;
            background: #2c241b;
            border-radius: 50%;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 0 8px #2c241b, 2px 2px 4px rgba(0,0,0,0.5);
            animation: floatSoot 3s ease-in-out infinite alternate;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* Fuzziness illusion */
        .soot::before, .soot::after {
            content: '';
            position: absolute;
            background: #2c241b;
            border-radius: 50%;
            z-index: -1;
        }
        .soot::before { width: 56px; height: 44px; top: 3px; left: -3px; transform: rotate(45deg); }
        .soot::after { width: 44px; height: 56px; top: -3px; left: 3px; transform: rotate(-45deg); }

        .soot:hover {
            animation: none;
            transform: translateY(-40px) scale(1.1);
        }
        .soot-eye {
            position: absolute;
            top: 12px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            z-index: 2;
        }
        .soot-eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            background: black;
            border-radius: 50%;
        }
        .soot-eye.left { left: 8px; }
        .soot-eye.right { right: 8px; }
        .soot.left-soot { left: 8%; animation-delay: 0s; }
        .soot.right-soot { right: 8%; animation-delay: 1.5s; }

        @keyframes floatSoot {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        /* Falling Leaves */
        .leaf {
            position: fixed;
            top: -10%;
            width: 20px;
            height: 20px;
            background-color: #8fbc8f; 
            border-radius: 0 50% 0 50%;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite, sway 4s ease-in-out infinite alternate;
        }
        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110vh; }
        }
        @keyframes sway {
            0% { transform: translateX(0px) rotate(0deg); }
            100% { transform: translateX(45px) rotate(70deg); }
        }

        /* Magic Sparkles */
        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
            animation: twinkle 2s infinite alternate;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes twinkle {
            0% { transform: scale(0.5); opacity: 0.2; }
            100% { transform: scale(1.3); opacity: 0.9; filter: drop-shadow(0 0 4px rgba(255,255,255,0.8)); }
        }

        /* Music Controls */
        #music-toggle {
            cursor: pointer;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- Audio Player -->
    <!-- I've added a Ghibli-style instrumental placeholder. Replace the src with your own local file like "music.mp3" -->
    <audio id="bg-music" loop autoplay>
        <source src="Rapsodi - JKT48.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Floating Music Toggle Button -->
    <button id="music-toggle" class="fixed bottom-6 right-6 glass w-14 h-14 flex items-center justify-center rounded-full shadow-lg text-2xl icon-btn" onclick="toggleMusic()" title="Play/Pause Music">
        🎵
    </button>

    <!-- Background Elements (SVG Clouds) -->
    <svg class="cloud cloud-1" viewBox="0 0 100 50" fill="rgba(255,255,255,0.9)"><path d="M20,40 Q10,40 10,30 Q10,20 25,20 Q30,10 45,10 Q65,10 70,25 Q85,20 90,30 Q95,40 80,40 Z"/></svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 50" fill="rgba(255,255,255,0.8)"><path d="M20,40 Q10,40 10,30 Q10,20 25,20 Q30,10 45,10 Q65,10 70,25 Q85,20 90,30 Q95,40 80,40 Z"/></svg>
    <svg class="cloud cloud-3" viewBox="0 0 100 50" fill="rgba(255,255,255,0.9)"><path d="M20,40 Q10,40 10,30 Q10,20 25,20 Q30,10 45,10 Q65,10 70,25 Q85,20 90,30 Q95,40 80,40 Z"/></svg>
    <svg class="cloud cloud-4" viewBox="0 0 100 50" fill="rgba(255,255,255,0.7)"><path d="M20,40 Q10,40 10,30 Q10,20 25,20 Q30,10 45,10 Q65,10 70,25 Q85,20 90,30 Q95,40 80,40 Z"/></svg>

    <!-- Ghibli Decorative Assets -->
    <!-- Soot Sprites (Susuwatari) -->
    <div class="soot left-soot">
        <div class="soot-eye left"></div>
        <div class="soot-eye right"></div>
    </div>
    <div class="soot right-soot">
        <div class="soot-eye left"></div>
        <div class="soot-eye right"></div>
    </div>

    <!-- Falling Leaves -->
    <div class="leaf" style="left: 15%; animation-duration: 14s; animation-delay: 0s;"></div>
    <div class="leaf" style="left: 35%; animation-duration: 18s; animation-delay: 4s; background-color: #ffd700;"></div>
    <div class="leaf" style="left: 65%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="leaf" style="left: 85%; animation-duration: 16s; animation-delay: 7s; background-color: #ffa500;"></div>
    <div class="leaf" style="left: 50%; animation-duration: 15s; animation-delay: 9s;"></div>

    <!-- Magic Sparkles -->
    <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 25%; left: 85%; animation-delay: 1.5s;"></div>
    <div class="sparkle" style="top: 45%; left: 10%; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="top: 60%; left: 80%; animation-delay: 2s;"></div>
    <div class="sparkle" style="top: 80%; left: 25%; animation-delay: 1.2s;"></div>
    <div class="sparkle" style="top: 10%; left: 50%; animation-delay: 0.8s;"></div>

    <div id="motes-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Background Music Element (Loop Added) -->
    <audio id="bg-music" loop preload="auto">
        <source src="Rapsodi - JKT48.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Music Toggle Button -->
        <div class="flex gap-6 mb-10 mt-4">
            <button onclick="togglePanel('cookie-panel')" class="icon-btn glass w-16 h-16 text-3xl flex items-center justify-center rounded-full shadow-md" title="Dubai Cookie">
                🍪
            </button>
            <button onclick="togglePanel('matcha-panel')" class="icon-btn glass w-16 h-16 text-3xl flex items-center justify-center rounded-full shadow-md" title="Matcha Latte">
                🍵
            </button>
            <button onclick="togglePanel('camera-panel')" class="icon-btn glass w-16 h-16 text-3xl flex items-center justify-center rounded-full shadow-md" title="Polaroid">
                📸
            </button>
        </div>

        <!-- Panel 1: Dubai Cookie -->
        <div id="cookie-panel" class="panel glass p-8 w-full max-w-md mx-auto mb-10">
            <p class="text-lg leading-relaxed text-gray-800">
                Serta mulai anak kicik segala doa terbaik untuk kamu, dan bahagia selalu. Aaminnn<br><br>
                <span class="font-semibold">warga bekasi yang mencintaimu&lt;3</span>
            </p>
        </div>

        <!-- Panel 2: Matcha Latte -->
        <div id="matcha-panel" class="panel glass p-6 inline-block mx-auto mb-10">
            <img src="0b24c7f8bbd48209c29ee5e71da83801.gif" onerror="this.onerror=null; this.src='https://placehold.co/400x300/b2cbde/2c241b?text=Ghibli+Cake'" alt="Ghibli Cake" style="max-width:100%; border-radius:8px;" class="mx-auto block shadow-sm">
        </div>

        <!-- Panel 3: Camera / Polaroid -->
        <div id="camera-panel" class="panel glass p-8 w-full max-w-md mx-auto mb-10">
            
            <!-- Character Selection Buttons -->
            <div id="character-selection" class="flex justify-center gap-4 flex-wrap">
                <button onclick="showPolaroid('gojo')" class="bg-white/70 hover:bg-white text-gray-800 font-semibold py-3 px-6 rounded-xl shadow transition">
                    😎 Gojo
                </button>
                <button onclick="showPolaroid('loid')" class="bg-white/70 hover:bg-white text-gray-800 font-semibold py-3 px-6 rounded-xl shadow transition">
                    🕵️ Loid Forger
                </button>
            </div>

            <!-- Polaroid View -->
            <div id="polaroid-view" class="hidden flex-col items-center">
                <div class="polaroid-frame mb-6">
                    <img id="polaroid-image" src="" onerror="this.onerror=null; this.src='https://placehold.co/400x500/f6d3a9/2c241b?text=Polaroid+Image'" alt="Polaroid" style="width: auto; max-width: 100%; height: 100%; object-fit: contain; max-height: 65vh; border-radius: 4px; background-color: #f3f4f6;">
                </div>
                <button onclick="hidePolaroid()" class="bg-white/50 border border-gray-400 hover:bg-white text-sm font-semibold text-gray-700 py-2 px-6 rounded-full transition shadow-sm">
                    Kembali
                </button>
            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script>
        // --- Music Player Logic ---
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        let isPlaying = false;

        // Many modern browsers block autoplay until the user interacts with the page.
        // This listener will automatically start the music the first time they click anywhere on the page if it was blocked.
        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().catch(e => console.log("Autoplay blocked, waiting for interaction..."));
            }
        }, { once: true });

        // Update button icon based on actual playback state
        bgMusic.onplaying = function() {
            isPlaying = true;
            musicToggle.innerHTML = '⏸️';
        };
        bgMusic.onpause = function() {
            isPlaying = false;
            musicToggle.innerHTML = '🎵';
        };

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
            } else {
                bgMusic.play();
            }
        }

        // --- Generate Motes ---
        const motesContainer = document.getElementById('motes-container');
        for (let i = 0; i < 20; i++) {
            const mote = document.createElement('div');
            mote.classList.add('mote');
            mote.style.left = `${Math.random() * 100}vw`;
            mote.style.animationDuration = `${Math.random() * 10 + 10}s`;
            mote.style.animationDelay = `${Math.random() * 20}s`;
            motesContainer.appendChild(mote);
        }

        // Panel Logic
        function togglePanel(panelId) {
            const panels = ['cookie-panel', 'matcha-panel', 'camera-panel'];
            
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (id === panelId) {
                    // Toggle current
                    if (el.classList.contains('active')) {
                        el.classList.remove('active');
                    } else {
                        el.classList.add('active');
                        // Reset camera panel if opened
                        if(id === 'camera-panel') hidePolaroid();
                    }
                } else {
                    // Close others
                    el.classList.remove('active');
                }
            });
        }

        // Camera Logic
        const charSelection = document.getElementById('character-selection');
        const polaroidView = document.getElementById('polaroid-view');
        const polaroidImg = document.getElementById('polaroid-image');

        function showPolaroid(character) {
            if (character === 'gojo') {
                polaroidImg.src = 'Jujutsu Kaisen Photoism Collage.png';
                polaroidImg.alt = 'Gojo Polaroid';
            } else if (character === 'loid') {
                polaroidImg.src = '653d262f-23bc-4430-8ca6-f5a1755109ba.png';
                polaroidImg.alt = 'Loid Polaroid';
            }
            
            charSelection.classList.add('hidden');
            charSelection.classList.remove('flex');
            
            polaroidView.classList.remove('hidden');
            polaroidView.classList.add('flex');
        }

        function hidePolaroid() {
            polaroidView.classList.add('hidden');
            polaroidView.classList.remove('flex');
            
            charSelection.classList.remove('hidden');
            charSelection.classList.add('flex');
            
            polaroidImg.src = '';
        }
    </script>
</body>
</html>
