    <script>
<!-- ... existing code ... -->
        function hidePolaroid() {
            polaroidView.classList.add('hidden');
            polaroidView.classList.remove('flex');
            
            charSelection.classList.remove('hidden');
            charSelection.classList.add('flex');
            
            polaroidImg.src = '';
        }

        // Music Logic
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.innerText = '🎵';
                isPlaying = false;
            } else {
                bgMusic.play();
                musicToggle.innerText = '⏸️';
                isPlaying = true;
            }
        }

        // Autoplay attempt on first interaction
        document.body.addEventListener('click', function() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    musicToggle.innerText = '⏸️';
                    isPlaying = true;
                }).catch(err => {
                    console.log('Autoplay prevented by browser.');
                });
            }
        }, { once: true });
    </script>
